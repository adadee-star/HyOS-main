name: Build Linux AppImage

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Copy Dependencies with Maven
      run: |
        mvn clean compile -f adam/pom.xml -U
        mvn dependency:copy-dependencies -f adam/pom.xml -DoutputDirectory=target/deps

    - name: Run jpackage
      run: |
        jpackage \
          --type app-image \
          --name "HyOS" \
          --module-path adam/target/deps:adam/target/classes \
          --module com.adam/com.adam.HyOS \
          --dest target/appimage-out

    - name: Download appimagetool and Install FUSE
      run: |
        sudo apt-get update
        sudo apt-get install -y libfuse2
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

    - name: Create Required AppImage Metadata
      run: |
        # 1. Create a minimal desktop file
        cat <<EOF > target/appimage-out/HyOS/HyOS.desktop
        [Desktop Entry]
        Type=Application
        Name=HyOS
        Exec=HyOS
        Icon=HyOS
        Categories=Utility;
        EOF
        
        # 2. Provide a placeholder PNG icon so it stops complaining
        convert -size 128x128 xc:blue target/appimage-out/HyOS/HyOS.png

    - name: Build Final AppImage
      env:
        APPIMAGE_EXTRACT_AND_RUN: 1
      run: |
        ./appimagetool-x86_64.AppImage target/appimage-out/HyOS

    - name: Upload AppImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HyOS-Linux
        path: "*.AppImage"
