name: Build Linux AppImage

on:
  push:
    branches: [ "*" ] # Runs automatically on any branch push
  workflow_dispatch: # Lets you trigger it manually whenever you want

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean javafx:jlink -f adam/pom.xml -U

    - name: Run jpackage
      run: |
        jpackage \
          --type app-image \
          --name "HyOS" \
          --module-path adam/target/image/mods \
          --module adam/com.adam.HyOS \
          --dest target/appimage-out

    - name: Download appimagetool
      run: |
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

    - name: Build Final AppImage
      run: |
        ./appimagetool-x86_64.AppImage target/appimage-out/HyOS

    - name: Upload AppImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HyOS-Linux
        path: "*.AppImage"
